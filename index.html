<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f1720"><link rel="manifest" href="manifest.webmanifest"><title>flow-hub</title><style>:root{--bg:#0f1720;--card:#17212d;--line:#26344a;--tx:#e8eef6;--mu:#8fa3ba;--ac:#4fd1c5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;line-height:1.6}main{max-width:900px;margin:auto;padding:18px 14px 80px}header{display:flex;align-items:center;gap:10px;margin-bottom:16px}h1{font-size:23px;margin:0;flex:1}.sub{color:var(--mu);font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}button,a.btn{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.pri{background:var(--ac);color:#102028;border-color:var(--ac);font-weight:800}.purpose{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:14px}.purpose button{text-align:left}.purpose b{display:block;font-size:15px}.continue{display:flex;align-items:center;gap:12px}.continue .body{flex:1}.actions{display:flex;gap:8px;flex-wrap:wrap}.music-menu{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:10px}.music-menu button{text-align:left}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.app{padding:14px;border:1px solid var(--line);border-radius:13px}.app h3{margin:0 0 3px;font-size:16px}.app p{margin:0 0 10px;color:var(--mu);font-size:12px}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:11px;color:var(--mu)}.queue{display:flex;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}.queue span{flex:1}.small{min-height:36px;padding:7px 10px;font-size:13px}.next-action{display:flex;align-items:center;gap:12px;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#121c27}.next-action .body{flex:1}.bottom{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,var(--bg) 35%);padding:20px 14px 10px}.bottom-in{max-width:900px;margin:auto}@media(max-width:720px){.purpose{grid-template-columns:repeat(2,1fr)}.grid,.music-menu{grid-template-columns:1fr}}@media(max-width:430px){.purpose{grid-template-columns:1fr}}</style></head><body><main><header><div style="font-size:30px">🧭</div><h1>flow-hub</h1><span class="tag">personal OS</span></header><section class="card"><h2 style="margin:0 0 4px">今日は何をする？</h2><div class="sub">アプリではなく、目的から始めます。</div><div class="purpose"><button class="pri" data-purpose="produce"><b>🎨 作る</b><span class="sub">音楽・制作・出力</span></button><button data-purpose="understand"><b>🧠 整理する</b><span class="sub">意味・知識・AI</span></button><button data-purpose="practice"><b>📚 学ぶ</b><span class="sub">英語・耳・AI</span></button><button data-purpose="capture"><b>🎙 残す</b><span class="sub">声・アイデア・素材</span></button><button data-purpose="review"><b>🔍 振り返る</b><span class="sub">意味・知識・制作</span></button></div></section><section class="card"><h3 id="purposeTitle" style="margin:0 0 5px">次の一手</h3><div id="purposeBody" class="sub">上の目的を選んでください。</div></section><section class="card"><h3 style="margin:0 0 8px">▶ 続きから</h3><div id="continue"></div></section><section class="card"><h3 style="margin:0 0 8px">今日のセッション</h3><div class="actions"><button data-action="start">▶ セッション開始</button><button data-action="capture">＋ 入口にメモ</button><button data-action="clear">リセット</button></div><div id="status" class="sub" style="margin-top:8px"></div><div id="queue"></div></section><section class="card"><h3 style="margin:0 0 8px">専門アプリ</h3><div class="grid" id="apps"></div></section><section class="card"><h3 style="margin:0 0 6px">設計</h3><div class="sub">Capture → Understand → Practice → Produce → Review。flow-hubは原本を奪わず、目的・状態・次の一手だけをつなぎます。</div></section></main><div class="bottom"><div class="bottom-in"><a class="btn pri" style="width:100%" href="https://github.com/norinori-jan/flow-hub" target="_blank">GitHubで開く</a></div></div><script>const apps={'flow-mind':{e:'https://norinori-jan.github.io/flow-mind/',i:'🧠',group:'CORE',d:'意味・意図・因果・感情・本音を整理する。'},'quick-ref':{e:'https://norinori-jan.github.io/quick-ref/',i:'📚',group:'KNOWLEDGE',d:'知識辞書。Q&A・メモ・検索・再利用。'},'ai-dojo':{e:'https://norinori-jan.github.io/ai-dojo/',i:'🥋',group:'KNOWLEDGE',d:'AIへの依頼を鍛える。目的・材料・制約・出力形式。'},'speak-native':{e:'https://norinori-jan.github.io/speak-native/',i:'🗣',group:'TRAINING',d:'英語イマージョン。Free Talk / Shadowing / 瞬間英作文。'},'ear-first':{e:'https://norinori-jan.github.io/ear-first/',i:'👂',group:'TRAINING',d:'耳から入る練習の専用入口。'},'voice-pad':{e:'https://norinori-jan.github.io/voice-pad/',i:'🎙',group:'CAPTURE',d:'録音を中心に扱う音声パッド。'},'music-suite':{e:'https://norinori-jan.github.io/music-suite/',i:'🎼',group:'MUSIC',d:'音楽制作の中核。vocal / canvas / chord / beat / score-editor。'},'lead-sheet':{e:'https://norinori-jan.github.io/lead-sheet/',i:'🎵',group:'MUSIC',d:'リードシート化・移調・PDF・画像・MusicXML・共有。'},'table-pad':{e:'https://norinori-jan.github.io/table-pad/',i:'📊',group:'DATA',d:'CSV/TSV・表編集・集計・可視化。'},'storage-check':{e:'https://norinori-jan.github.io/storage-check/',i:'💾',group:'SYSTEM',d:'ブラウザ保存領域を点検。'}};const purposes={produce:{title:'🎨 作る',body:'何を作りますか？',items:[['🎼 音楽を作る','music-suite'],['🎵 リードシートを作る','lead-sheet'],['📊 データを整える','table-pad'],['🎙 素材を録る','voice-pad']]},understand:{title:'🧠 整理する',body:'何を整理しますか？',items:[['🧠 頭の中を整理する','flow-mind'],['📚 知識を整理する','quick-ref'],['🥋 AIへの質問を整理する','ai-dojo'],['📊 データを整理する','table-pad']]},practice:{title:'📚 学ぶ',body:'何を鍛えますか？',items:[['🗣 英語を使う','speak-native'],['👂 耳を鍛える','ear-first'],['🥋 AIの使い方を鍛える','ai-dojo']]},capture:{title:'🎙 残す',body:'何を残しますか？',items:[['🎙 声・音声を残す','voice-pad'],['🧠 今の意図を残す','flow-mind'],['📚 知識を残す','quick-ref'],['🎼 音楽の素材を残す','music-suite']]},review:{title:'🔍 振り返る',body:'何を振り返りますか？',items:[['🧠 自分の意図・流れ','flow-mind'],['📚 学んだこと','quick-ref'],['🎼 作った曲','music-suite']]}};const musicItems=[['新しい曲を作る','music-suite'],['録音から作る','music-suite'],['コードから作る','music-suite'],['曲を編集する','music-suite'],['リードシートを作る','lead-sheet'],['MIDIを出す','music-suite'],['過去の曲を見る','music-suite']];const $=s=>document.querySelector(s),KEY='flow_hub_v1';function load(){try{return JSON.parse(localStorage.getItem(KEY))||{started:0,q:[],lastApp:null,lastPurpose:null}}catch(e){return{started:0,q:[],lastApp:null,lastPurpose:null}}}function save(s){localStorage.setItem(KEY,JSON.stringify(s))}function receiveHandoff(){try{const m=location.hash.match(/^#hub_handoff_v1=(.+)$/);if(!m)return;const h=JSON.parse(decodeURIComponent(m[1]));if(!h||h.protocol!=='hub_handoff_v1')return;const s=load();s.lastApp=h.source||s.lastApp;s.lastPurpose='review';s.lastStatus=h.payload&&h.payload.status||'completed';s.lastAt=h.createdAt||new Date().toISOString();s.lastHandoff=h;s.nextAction=h.payload&&h.payload.nextAction||null;s.nextActionMessage=h.payload&&h.payload.message||'';s.nextActionRecommendation=h.payload&&h.payload.recommendation||null;save(s);history.replaceState(null,'',location.pathname+location.search)}catch(e){}}function openApp(k){const s=load();s.lastApp=k;save(s);location.href=apps[k].e}function showPurpose(k){const p=purposes[k];$('#purposeTitle').textContent=p.title;$('#purposeBody').innerHTML='<div class="sub" style="margin-bottom:8px">'+p.body+'</div>'+p.items.map(x=>`<button class="small" data-app="${x[1]}">${x[0]}</button>`).join(' ');if(k==='produce')$('#purposeBody').innerHTML+='<div style="margin-top:14px"><b>🎼 音楽</b><div class="music-menu">'+musicItems.map(x=>`<button data-app="${x[1]}">${x[0]}</button>`).join('')+'</div></div>'}function render(){const s=load();$('#status').textContent=s.lastStatus==='completed'?'完了：'+(s.lastApp||'music-suite')+' から戻りました。':s.started?'セッション中：'+new Date(s.started).toLocaleString('ja-JP'):'セッション未開始';const n=s.nextActionRecommendation;if(n&&n.app&&apps[n.app]){$('#purposeBody').innerHTML='<div class="sub">music-suiteでの制作が完了しました。</div><div class="next-action"><div class="body"><b>'+n.label+'</b><div class="sub">'+(s.nextActionMessage||'続きの作業を選べます。')+'</div></div><button class="pri small" data-app="'+n.app+'">続ける</button></div>'; }$('#queue').innerHTML=s.q.length?s.q.map((x,i)=>`<div class="queue"><span>${x}</span><button class="small" data-go="${i}">開く</button></div>`).join(''):'<div class="sub" style="padding-top:8px">入口メモはここに並びます。</div>';$('#continue').innerHTML=s.lastApp&&apps[s.lastApp]?`<div class="continue"><div class="body"><b>${apps[s.lastApp].i} ${s.lastApp}</b><div class="sub">前回使ったアプリから再開</div></div><button class="pri small" data-app="${s.lastApp}">続ける</button></div>`:'<div class="sub">まだありません。目的を選んで始めましょう。</div>'}$('#apps').innerHTML=Object.entries(apps).map(([k,v])=>`<div class="app"><span class="tag">${v.group}</span><h3>${v.i} ${k}</h3><p>${v.d}</p><a class="btn small" href="${v.e}" target="_blank">開く</a></div>`).join('');document.addEventListener('click',e=>{const p=e.target.closest('[data-purpose]');if(p){const s=load();s.lastPurpose=p.dataset.purpose;save(s);showPurpose(p.dataset.purpose);return}const a=e.target.closest('[data-app]');if(a){openApp(a.dataset.app);return}const act=e.target.closest('[data-action]');if(act){const s=load();if(act.dataset.action==='start')s.started=Date.now();if(act.dataset.action==='clear'){localStorage.removeItem(KEY);render();return}if(act.dataset.action==='capture'){const x=prompt('今やること／残すこと');if(x)s.q.push(x)}save(s);render();return}const g=e.target.closest('[data-go]');if(g){const s=load(),x=s.q[+g.dataset.go];if(x){const k=x.includes('英語')?'speak-native':x.includes('AI')?'ai-dojo':x.includes('音楽')?'music-suite':'quick-ref';openApp(k)}}});receiveHandoff();render();</script></body></html>
