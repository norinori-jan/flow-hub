<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f1720"><link rel="manifest" href="manifest.webmanifest"><title>flow-hub</title><style>
:root{--bg:#0f1720;--card:#17212d;--line:#26344a;--tx:#e8eef6;--mu:#8fa3ba;--ac:#4fd1c5;--ok:#7bd88f;--wn:#ffd166}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;line-height:1.6}main{max-width:820px;margin:auto;padding:18px 14px 90px}header{display:flex;align-items:center;gap:10px;margin-bottom:14px}h1{font-size:22px;margin:0;flex:1}button,a.btn{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 13px;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}.pri{background:var(--ac);color:#102028;border-color:var(--ac);font-weight:800}.sub{color:var(--mu);font-size:13px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin:12px 0}.hero h2{margin:0 0 5px;font-size:19px}.intent{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}.intent button{text-align:left;display:block}.intent b{display:block}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.app{padding:13px}.app h3{margin:0 0 3px;font-size:16px}.app p{margin:0 0 9px;color:var(--mu);font-size:12px}.row{display:flex;gap:8px;flex-wrap:wrap}.queue{display:flex;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}.queue:first-child{border-top:0}.queue span{flex:1}.small{min-height:36px;padding:7px 10px;font-size:13px}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:11px;color:var(--mu);margin:2px}.hide{display:none!important}textarea,input{width:100%;font:inherit;background:#0b1118;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:10px}textarea{min-height:80px}.bottom{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,var(--bg) 35%);padding:22px 14px 12px}.bottom-in{max-width:820px;margin:auto}.muted{color:var(--mu)}@media(max-width:600px){.grid,.intent{grid-template-columns:1fr}.hero{padding:13px}}
</style></head><body><main>
<header><div style="font-size:28px">🧭</div><h1>flow-hub</h1><span class="tag">personal workbench</span></header>
<section class="hero"><h2>「今なにをしたい？」から、道具を選ぶ</h2><div class="sub">8個のアプリを統合するのではなく、入口だけを統合する。データは各アプリに残し、作業の切り替えコストを下げる。</div><div class="intent">
<button class="pri" data-open="quick-ref"><b>🧠 知識を残す</b><span class="sub">AI回答・メモ・検索</span></button>
<button data-open="speak-native"><b>🗣 英語を使う</b><span class="sub">会話・瞬間英作文・シャドーイング</span></button>
<button data-open="ai-dojo"><b>🥋 AIの使い方を鍛える</b><span class="sub">依頼文・課題・添削</span></button>
<button data-open="ear-first"><b>👂 耳を鍛える</b><span class="sub">聴覚中心の練習</span></button>
<button data-open="table-pad"><b>📊 表を扱う</b><span class="sub">CSV/TSV・集計・可視化</span></button>
<button data-open="voice-pad"><b>🎙 声を扱う</b><span class="sub">録音・音声メモ</span></button>
<button data-open="lead-sheet"><b>🎼 音楽を形にする</b><span class="sub">楽譜・移調・MusicXML</span></button>
<button data-open="storage-check"><b>💾 保存状態を見る</b><span class="sub">localStorage / IndexedDB</span></button>
</div></section>
<section class="card"><h3 style="margin:0 0 8px">今日の流れ</h3><div class="row"><button data-action="start">▶ セッション開始</button><button data-action="capture">＋ 入口にメモ</button><button data-action="clear">リセット</button></div><div id="status" class="sub" style="margin-top:8px"></div><div id="queue"></div></section>
<section class="card"><h3 style="margin:0 0 8px">アプリ一覧</h3><div class="grid" id="apps"></div></section>
<section class="card"><h3 style="margin:0 0 6px">設計思想</h3><div class="sub">Capture → Understand → Practice → Produce → Review。flow-hub は「全部入りアプリ」ではなく、次の一手を決めるコックピット。</div></section>
</main><div class="bottom"><div class="bottom-in"><a class="btn pri" style="width:100%" href="https://github.com/norinori-jan/flow-hub" target="_blank">GitHubで開く</a></div></div>
<script>
const apps={
'quick-ref':{e:'https://norinori-jan.github.io/quick-ref/',i:'🧠',d:'知識辞書。Q&Aを項目にまとめ、検索・リンク・理解状態で再利用。'},
'speak-native':{e:'https://norinori-jan.github.io/speak-native/',i:'🗣',d:'英語イマージョン。Free Talk / Shadowing / 瞬間英作文 / 単語帳。'},
'ai-dojo':{e:'https://norinori-jan.github.io/ai-dojo/',i:'🥋',d:'AIへの依頼を練習。目的・材料・制約・出力形式を鍛える。'},
'ear-first':{e:'https://norinori-jan.github.io/ear-first/',i:'👂',d:'耳から入る練習の専用入口。'},
'table-pad':{e:'https://norinori-jan.github.io/table-pad/',i:'📊',d:'表データを貼る・編集する・可視化する。'},
'voice-pad':{e:'https://norinori-jan.github.io/voice-pad/',i:'🎙',d:'録音を中心に扱う音声パッド。'},
'lead-sheet':{e:'https://norinori-jan.github.io/lead-sheet/',i:'🎼',d:'曲データから楽譜を出力。移調・PDF・画像・MusicXML・共有。'},
'storage-check':{e:'https://norinori-jan.github.io/storage-check/',i:'💾',d:'ブラウザ保存領域を点検。IndexedDBやlocalStorageの使用量を確認。'}
};
const $=s=>document.querySelector(s); const KEY='flow_hub_v1';
function save(x){localStorage.setItem(KEY,JSON.stringify(x))} function load(){try{return JSON.parse(localStorage.getItem(KEY))||{started:0,q:[]}}catch(e){return{started:0,q:[]}}}
function render(){const s=load();$('#status').textContent=s.started?'セッション中：'+new Date(s.started).toLocaleString('ja-JP'):'セッション未開始';$('#queue').innerHTML=s.q.length?s.q.map((x,i)=>`<div class="queue"><span>${x}</span><button class="small" data-go="${i}">開く</button></div>`).join(''):'<div class="sub" style="padding-top:8px">入口メモはここに並びます。まず「入口にメモ」から。</div>';}
$('#apps').innerHTML=Object.entries(apps).map(([k,v])=>`<div class="app"><h3>${v.i} ${k}</h3><p>${v.d}</p><a class="btn small" href="${v.e}" target="_blank">開く</a></div>`).join('');
document.addEventListener('click',e=>{const o=e.target.closest('[data-open]');if(o){const k=o.dataset.open;location.href=apps[k].e;return}const a=e.target.closest('[data-action]');if(a){const s=load();if(a.dataset.action==='start')s.started=Date.now();if(a.dataset.action==='clear')localStorage.removeItem(KEY);if(a.dataset.action==='capture'){const x=prompt('今やること／残すこと');if(x)s.q.push(x)}save(s);render();return}const g=e.target.closest('[data-go]');if(g){const s=load(),x=s.q[+g.dataset.go];if(x){const k=x.includes('英語')?'speak-native':x.includes('AI')?'ai-dojo':x.includes('音楽')?'lead-sheet':'quick-ref';location.href=apps[k].e}}});render();
</script></body></html>
